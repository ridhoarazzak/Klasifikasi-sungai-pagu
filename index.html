<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Peta Klasifikasi Sungai Pagu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { margin: 0; font-family: sans-serif; background: #f4f4f4; }
    #map { height: 60vh; }
    #chart-container { width: 90%; max-width: 650px; margin: 1rem auto; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 1rem;
    }
    button {
      padding: 8px 14px;
      font-size: 14px;
      background-color: #008CBA;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #006f94;
    }
    .legend {
      background: white;
      padding: 8px;
      font-size: 13px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      line-height: 18px;
    }
    .legend i {
      width: 14px;
      height: 14px;
      float: left;
      margin-right: 8px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<h2 style="text-align:center">Peta Klasifikasi Lahan - Sungai Pagu</h2>
<div id="map"></div>

<div class="controls">
  <button onclick="toggleLayer('geojson')">Toggle GeoJSON</button>
  <button onclick="toggleLayer('tile')">Toggle Tile GEE</button>
  <button onclick="downloadCSV()">Download CSV</button>
</div>

<div id="chart-container">
  <canvas id="chart"></canvas>
</div>

<!-- Leaflet & plugin -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<!-- Chart.js untuk grafik -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- PapaParse untuk ekspor CSV -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<!-- Turf.js untuk menghitung luas -->
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script>
window.onload = () => {
  const map = L.map('map').setView([-1.48, 101.06], 12);

  let geojsonLayer = null;
  let geeTileLayer = null;

  // Basemap
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // GEE Tile Layer
  geeTileLayer = L.tileLayer("https://earthengine.googleapis.com/v1/projects/ee-mrgridhoarazzak/maps/c185eaed844ee168dc99d51c8ac536c6-922d7e63267b033c27c24c60af7b5eb0/tiles/{z}/{x}/{y}", {
    attribution: "Google Earth Engine",
    opacity: 0.7
  }).addTo(map);

  const warnaKelas = {
    sawah: "#ffed63",
    bukansawah: "#cccccc",
    sungai: "#5ca8f8",
    pemukiman: "#ff6c4c",
    hutan: "#178408"
  };

  const geojsonURL = "https://raw.githubusercontent.com/ridhoarazzak/Klasifikasi-sungai-pagu/main/klasifikasi_polygon_sungai_pagu.json";

  fetch(geojsonURL)
    .then(res => res.json())
    .then(data => {
      let dataKelas = {};

      geojsonLayer = L.geoJSON(data, {
        style: f => {
          const k = f.properties.Kelas;
          return {
            color: warnaKelas[k] || "#888",
            fillColor: warnaKelas[k] || "#888",
            weight: 1,
            fillOpacity: 0.4
          };
        },
        onEachFeature: (feature, layer) => {
          const k = feature.properties.Kelas || "Tidak Diketahui";

          // Hitung luas dengan turf.js (meter persegi), konversi ke hektar
          const luas_m2 = turf.area(feature);
          const luas = luas_m2 / 10000;

          dataKelas[k] = (dataKelas[k] || 0) + luas;

          layer.bindPopup(`<b style="color:${warnaKelas[k] || "#000"}">${k}</b><br>Luas: ${luas.toFixed(2)} ha`);
        }
      }).addTo(map);

      map.fitBounds(geojsonLayer.getBounds());
      buatChart(dataKelas);
      tambahLegend();
      window.downloadCSV = () => exportCSV(dataKelas);  // tombol bisa panggil ini
    });

  function buatChart(data) {
    const labels = Object.keys(data);
    const values = labels.map(k => data[k]);
    const colors = labels.map(k => warnaKelas[k] || "#888");

    const ctx = document.getElementById('chart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Luas (ha)',
          data: values,
          backgroundColor: colors
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          title: {
            display: true,
            text: 'Luas Tiap Kelas Lahan (ha)'
          }
        }
      }
    });
  }

  function exportCSV(data) {
    const rows = [["Kelas", "Luas (ha)"]];
    for (const [k, v] of Object.entries(data)) {
      rows.push([k, v.toFixed(2)]);
    }
    const csv = Papa.unparse(rows);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.setAttribute("download", "klasifikasi.csv");
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function tambahLegend() {
    const legend = L.control({ position: "bottomright" });
    legend.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML = "<strong>Legenda</strong><br>";
      for (const [k, warna] of Object.entries(warnaKelas)) {
        div.innerHTML += `<i style="background:${warna}"></i> ${k}<br>`;
      }
      return div;
    };
    legend.addTo(map);
  }

  window.toggleLayer = function (layerName) {
    if (layerName === "geojson") {
      if (map.hasLayer(geojsonLayer)) {
        map.removeLayer(geojsonLayer);
      } else {
        map.addLayer(geojsonLayer);
      }
    } else if (layerName === "tile") {
      if (map.hasLayer(geeTileLayer)) {
        map.removeLayer(geeTileLayer);
      } else {
        map.addLayer(geeTileLayer);
      }
    }
  };
};
</script>

</body>
  </html>
